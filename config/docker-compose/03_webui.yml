  db:
    image: postgres:14-alpine
    container_name: peon.db
    hostname: peon.db
    environment:
      - DEV_MODE=${DEV_MODE}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST_AUTH_METHOD=${POSTGRES_HOST_AUTH_METHOD}
      - POSTGRES_INITDB_ARGS=${POSTGRES_INITDB_ARGS}
    volumes:
      - $PWD/db:/var/lib/postgresql/data
      - /var/log/peon:/var/log/peon
    networks:
      zugnet:
        ipv4_address: 172.20.0.3
    restart: unless-stopped
    labels:
      com.peon.description: "Peon backend DB (PostgreSQL)"
  webapp:
    container_name: peon.webui
    hostname: peon.webui
    image: umlatt/peon.webui:latest
    depends_on:
      - db
    environment:
      - PEON_ENABLE_TEST_SEED=${PEON_ENABLE_TEST_SEED:-false}
      - PEON_TEST_ADMIN_USERNAME=${PEON_TEST_ADMIN_USERNAME:-admin}
      - PEON_TEST_ADMIN_PASSWORD=${PEON_TEST_ADMIN_PASSWORD:-admin123456}
      - PEON_TEST_ADMIN_EMAIL=${PEON_TEST_ADMIN_EMAIL:-admin@peon.local}
      - PEON_TEST_DASH_USERNAME=${PEON_TEST_DASH_USERNAME:-testadmin}
      - PEON_TEST_DASH_PASSWORD=${PEON_TEST_DASH_PASSWORD:-Test1234!}
      - PEON_TEST_DASH_EMAIL=${PEON_TEST_DASH_EMAIL:-testadmin@peon.local}
    ports:
      - '${PEON_WEBUI_HOST_PORT:-80}:80'
    volumes:
      - $PWD/warplans:/app/warplans:ro
    networks:
      zugnet:
        ipv4_address: 172.20.0.4
    restart: unless-stopped
